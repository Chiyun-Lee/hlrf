    <meta charset="utf-8" />

    <title>Human Pretraining</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- pdf.js (reader.js), the handwriting font and MathJax -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- STIX Two: the typeface of scientific journals, for paper titles and abstracts in For you. Only For you uses it,
         so it loads without holding up the page or its scripts (media="print" until it has arrived). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap" media="print" onload="this.media = 'all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap" /></noscript>
    <link rel="stylesheet" href="style.css" />
    <script>
      // arXiv titles and abstracts carry inline LaTeX ($\Lambda$CDM). MathJax itself loads the first time For you
      // typesets (typeset in foryou.js).
      window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] } };
    </script>
