<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="f1t f1d">
<style>
:root {
  --bg: #f4f5f9; --surface: #ffffff; --ink: #1d2753; --muted: #5b6386; --line: #c6cbde;
  --lit: #2f6fb3; --lit-tint: #e5edf8;
  --data: #a8620c; --data-tint: #f9eedd;
  --agree: #2b7a4b; --agree-tint: #e2f1e7;
  --clash: #b2393a; --clash-tint: #f8e3e1;
  --limit: #74489f; --limit-tint: #eee7f7;
  --display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11142a; --surface: #1a1f3d; --ink: #e2e6f6; --muted: #9ba3c6; --line: #353d68;
  --lit: #82b2ec; --lit-tint: #1c2b4b; --data: #e3a659; --data-tint: #392917;
  --agree: #6fc490; --agree-tint: #16321f; --clash: #ee8582; --clash-tint: #3a1d20;
  --limit: #b99ee8; --limit-tint: #2a2143; } }
svg text { font-family: var(--body); fill: var(--ink); }
.t-h { font-family: var(--display); font-weight: 700; font-size: 17px; }
.t-b { font-weight: 700; font-size: 14px; }
.t-s { font-size: 12.5px; fill: var(--muted); }
.t-i { font-size: 12.5px; font-style: italic; fill: var(--ink); }
.t-m { font-family: var(--mono); font-size: 11px; fill: var(--muted); letter-spacing: .04em; }
.t-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.panel-lit { fill: var(--lit-tint); stroke: var(--lit); stroke-width: 1.2; }
.panel-data { fill: var(--data-tint); stroke: var(--data); stroke-width: 1.2; }
.c-lit { fill: var(--lit); } .c-data { fill: var(--data); }
.c-agree { fill: var(--agree); } .c-clash { fill: var(--clash); } .c-limit { fill: var(--limit); } .c-ink { fill: var(--ink); }
.tint-agree { fill: var(--agree-tint); stroke: var(--agree); stroke-width: 1.2; }
.tint-clash { fill: var(--clash-tint); stroke: var(--clash); stroke-width: 1.2; }
.tint-limit { fill: var(--limit-tint); stroke: var(--limit); stroke-width: 1.2; }
.card { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.card-band { fill: var(--ink); }
.on-band { fill: var(--surface); }
.rule { stroke: var(--line); stroke-width: 1; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.flow-lit { fill: none; stroke: var(--lit); stroke-width: 1.8; }
.flow-data { fill: none; stroke: var(--data); stroke-width: 1.8; }
.arrowhead { fill: var(--muted); }
.e-agree { stroke: var(--agree); stroke-width: 2.4; fill: none; }
.e-clash { stroke: var(--clash); stroke-width: 2.4; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
.e-limit { stroke: var(--limit); stroke-width: 2.4; fill: none; stroke-dasharray: 9 5; }
.agent { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.pi { fill: var(--ink); }
.chip { fill: var(--surface); stroke-width: 1.2; }
.gate { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 5 3; }
.out { fill: var(--ink); }
.out-t { fill: var(--surface); }
.out-s { fill: var(--surface); opacity: .82; font-size: 12.5px; }
</style>
<rect width="1120" height="580" rx="10" style="fill: var(--surface)"/>
        <title id="f1t">Building a paper agent's context</title>
        <desc id="f1d">Summaries and edits from reading the paper, and reproduction results from dataset modelling, pass a quote gate into one paper context, which the paper agent speaks from.</desc>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>

        <!-- Literature panel -->
        <rect class="panel-lit" x="20" y="28" width="330" height="290" rx="10"/>
        <text class="t-h" x="36" y="56">Literature</text>
        <text class="t-tag c-lit" x="334" y="56" text-anchor="end">READING · SUMMARISING</text>
        <g>
          <rect class="box" x="36" y="72" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="94">Paper text</text>
          <text class="t-s" x="50" y="113">full text, extracted page by page</text>
          <rect class="box" x="36" y="132" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="154">Page notes</text>
          <text class="t-s" x="50" y="173">plain-language summary of each section</text>
          <rect class="box" x="36" y="192" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="214">Your edits and the tutor's</text>
          <text class="t-s" x="50" y="233">notes reworded after your questions</text>
          <rect class="box" x="36" y="252" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="274">Summary cards</text>
          <text class="t-s" x="50" y="293">key findings, evidence map, caveats</text>
        </g>

        <!-- Dataset modelling panel -->
        <rect class="panel-data" x="20" y="338" width="330" height="222" rx="10"/>
        <text class="t-h" x="36" y="366">Dataset modelling</text>
        <text class="t-tag c-data" x="334" y="366" text-anchor="end">RE-RUNNING · TESTING</text>
        <g>
          <rect class="box" x="36" y="382" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="404">paper2agent review</text>
          <text class="t-s" x="50" y="423">re-runs the authors' code on their data</text>
          <rect class="box" x="36" y="442" width="298" height="52" rx="7"/>
          <text class="t-b" x="50" y="464">Reproduction</text>
          <text class="t-s" x="50" y="483">paper's number vs re-run: holds or not</text>
          <rect class="box" x="36" y="502" width="298" height="46" rx="7"/>
          <text class="t-b" x="50" y="521">Provenance and concerns</text>
          <text class="t-s" x="50" y="539">pinned on every figure and table</text>
        </g>

        <!-- flows into the gate -->
        <path class="flow-lit" d="M350,173 C385,173 385,250 412,250" marker-end="url(#ah)"/>
        <text class="t-m" x="356" y="160">+ edits</text>
        <text class="t-m" x="356" y="146">summaries</text>
        <path class="flow-data" d="M350,449 C385,449 385,350 412,350" marker-end="url(#ah)"/>
        <text class="t-m" x="356" y="474">re-runs</text>
        <text class="t-m" x="356" y="488">+ verdicts</text>

        <!-- Quote gate -->
        <rect class="gate" x="414" y="200" width="122" height="200" rx="10"/>
        <text class="t-b" x="475" y="236" text-anchor="middle">Quote gate</text>
        <text class="t-s" x="475" y="262" text-anchor="middle">every quote is</text>
        <text class="t-s" x="475" y="280" text-anchor="middle">string-checked</text>
        <text class="t-s" x="475" y="298" text-anchor="middle">against the</text>
        <text class="t-s" x="475" y="316" text-anchor="middle">paper's text</text>
        <line class="rule" x1="434" y1="336" x2="516" y2="336"/>
        <text class="t-m" x="475" y="360" text-anchor="middle">NO MATCH</text>
        <text class="t-m" x="475" y="376" text-anchor="middle">→ DROPPED</text>

        <path class="flow" d="M536,300 L566,300" marker-end="url(#ah)"/>

        <!-- Paper context card -->
        <rect class="card" x="570" y="40" width="290" height="500" rx="10"/>
        <path class="card-band" d="M570,50 a10,10 0 0 1 10,-10 h270 a10,10 0 0 1 10,10 v42 h-290 z"/>
        <text class="t-h on-band" x="588" y="70">Paper context</text>
        <text class="t-tag on-band" x="842" y="70" text-anchor="end" opacity=".75">ONE PER PAPER</text>
        <text class="t-tag on-band" x="588" y="85" opacity=".75">CLAIM, EVIDENCE, LIMITS, QUOTES</text>

        <g>
          <text class="t-b" x="588" y="122">Claims</text>
          <text class="t-s" x="588" y="141">each tied to a verbatim quote</text>
          <circle class="c-lit" cx="836" cy="118" r="6"/>
          <line class="rule" x1="586" y1="160" x2="844" y2="160"/>

          <text class="t-b" x="588" y="186">Methods and data</text>
          <text class="t-s" x="588" y="205">what was measured, on which data</text>
          <circle class="c-lit" cx="820" cy="182" r="6"/><circle class="c-data" cx="836" cy="182" r="6"/>
          <line class="rule" x1="586" y1="224" x2="844" y2="224"/>

          <text class="t-b" x="588" y="250">Limits and caveats</text>
          <text class="t-s" x="588" y="269">quoted from the paper and its cards</text>
          <circle class="c-lit" cx="836" cy="246" r="6"/>
          <line class="rule" x1="586" y1="288" x2="844" y2="288"/>

          <text class="t-b" x="588" y="314">Reproduced?</text>
          <text class="t-s" x="588" y="333">holds · fails · untested, per claim</text>
          <circle class="c-data" cx="836" cy="310" r="6"/>
          <line class="rule" x1="586" y1="352" x2="844" y2="352"/>

          <text class="t-b" x="588" y="378">Open concerns</text>
          <text class="t-s" x="588" y="397">raised by the agent review</text>
          <circle class="c-data" cx="836" cy="374" r="6"/>
          <line class="rule" x1="586" y1="416" x2="844" y2="416"/>
        </g>

        <!-- version strip: the context is updated, not written once -->
        <text class="t-m" x="588" y="442">UPDATED AS YOU WORK</text>
        <g>
          <rect class="box" x="588" y="454" width="76" height="62" rx="6"/>
          <text class="t-tag" x="626" y="472" text-anchor="middle">v1</text>
          <text class="t-s" x="626" y="490" text-anchor="middle">paper</text>
          <text class="t-s" x="626" y="506" text-anchor="middle">text</text>
          <path class="flow" d="M664,485 L676,485" marker-end="url(#ah)"/>
          <rect class="box" x="678" y="454" width="76" height="62" rx="6"/>
          <text class="t-tag" x="716" y="472" text-anchor="middle">v2</text>
          <text class="t-s" x="716" y="490" text-anchor="middle">+ notes</text>
          <text class="t-s" x="716" y="506" text-anchor="middle">+ edits</text>
          <path class="flow" d="M754,485 L766,485" marker-end="url(#ah)"/>
          <rect class="box" x="768" y="454" width="76" height="62" rx="6"/>
          <text class="t-tag" x="806" y="472" text-anchor="middle">v3</text>
          <text class="t-s" x="806" y="490" text-anchor="middle">+ re-run</text>
          <text class="t-s" x="806" y="506" text-anchor="middle">results</text>
        </g>

        <path class="flow" d="M860,250 L908,250" marker-end="url(#ah)"/>

        <!-- Paper agent -->
        <circle class="agent" cx="990" cy="250" r="64"/>
        <circle class="c-ink" cx="990" cy="230" r="15"/>
        <path class="c-ink" d="M962,282 a28,26 0 0 1 56,0 z"/>
        <text class="t-h" x="990" y="346" text-anchor="middle">Paper agent</text>
        <text class="t-s" x="990" y="368" text-anchor="middle">knows one paper</text>
        <text class="t-s" x="990" y="386" text-anchor="middle">answers, defends and</text>
        <text class="t-s" x="990" y="404" text-anchor="middle">concedes from its context</text>
        <path class="flow" d="M990,428 L990,470" marker-end="url(#ah)"/>
        <text class="t-m" x="990" y="492" text-anchor="middle">JOINS THE</text>
        <text class="t-m" x="990" y="508" text-anchor="middle">JOURNAL CLUB</text>
        <text class="t-m" x="990" y="524" text-anchor="middle">(FIGURE 2)</text>

        <!-- legend -->
        <circle class="c-lit" cx="586" cy="562" r="5"/><text class="t-s" x="597" y="566">from literature</text>
        <circle class="c-data" cx="706" cy="562" r="5"/><text class="t-s" x="717" y="566">from dataset modelling</text>
      </svg>
