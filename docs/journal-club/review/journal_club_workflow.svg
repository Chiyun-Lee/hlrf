<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Library Journal Club — workflow</title>
  <desc>Figure 1, the workflow. You name the field. Eight papers from your Zotero library become PhD-student agents. In one night they run three rounds: map every pair as agree, disagree or shared limitation; debate the clashes with verdicts; write five to ten research directions with evidence. A PI chairs and checks quotes. An archive keeps everything. You read the minutes in the morning.</desc>
  <style>
    .t { font-size: 12px; fill: #1f2937; }
    .ts { font-size: 10.5px; fill: #4b5563; }
    .tb { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .lib { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.5; }
    .you { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.5; }
    .pi { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; }
    .students { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
    .round { fill: #ffffff; stroke: #6c8ebf; stroke-width: 1.5; }
    .archive { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
    .cont { fill: #eef3fb; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .contlbl { font-size: 12px; font-weight: 700; fill: #374151; }
    .edge { fill: none; stroke: #374151; stroke-width: 2; }
    .edge2 { fill: none; stroke: #374151; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .num { fill: #111827; }
    .numt { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 3h8v18H3z"/><path d="M13 3h8v18h-8z"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 2h6v2h-1v5l6 10a2 2 0 0 1-1.7 3H5.7A2 2 0 0 1 4 19l6-10V4H9z"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><rect x="2" y="19" width="10" height="3" rx="1"/><rect x="5" y="9" width="12" height="4" rx="1" transform="rotate(-45 11 11)"/><rect x="12" y="1" width="5" height="9" rx="1" transform="rotate(-45 14.5 5.5)"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><path d="M8 5h8l4 4v12H8z" stroke-width="1.6"/><path d="M4 2h8v3H8v14H4z" stroke-width="1.6"/><path d="M11 13h6M11 16h6" fill="none" stroke-width="1.6"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke-width="2"/></symbol>
    <symbol id="i-minutes" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="2" fill="none" stroke-width="2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 11h8M8 15h8M8 19h5" fill="none" stroke-width="1.8"/></symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="30" y="36" class="title">Figure 1 · Library Journal Club — the workflow</text>
  <text x="30" y="56" class="sub">Eight papers talk for one night, in three rounds, and leave you a list of research directions with the evidence behind each.</text>

  <!-- You -->
  <rect x="30" y="100" width="210" height="64" rx="8" class="you"/>
  <use href="#i-flask" x="42" y="117" width="30" height="30" fill="#d79b00"/>
  <text x="82" y="124" class="tb">You</text>
  <text x="82" y="141" class="ts">name the field, pick 8 papers, 10 pm</text>
  <text x="82" y="155" class="ts">read the minutes, 8 am</text>

  <!-- Library -->
  <rect x="30" y="200" width="210" height="64" rx="8" class="lib"/>
  <use href="#i-book" x="42" y="217" width="30" height="30" fill="#82b366"/>
  <text x="82" y="224" class="tb">Your Zotero library</text>
  <text x="82" y="241" class="ts">8 papers on one topic</text>
  <text x="82" y="255" class="ts">PDF + metadata</text>

  <!-- Students -->
  <rect x="30" y="300" width="210" height="84" rx="8" class="students"/>
  <use href="#i-docs" x="42" y="322" width="30" height="30" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="82" y="322" class="tb">8 PhD students</text>
  <text x="82" y="339" class="ts">one agent per paper</text>
  <text x="82" y="353" class="ts">each knows one paper: claim,</text>
  <text x="82" y="367" class="ts">evidence, limits, quotes</text>

  <path d="M135 164V200" class="edge" marker-end="url(#ah)"/>
  <path d="M135 264V300" class="edge" marker-end="url(#ah)"/>
  <text x="145" y="286" class="ts">one prompt per paper</text>

  <!-- Club container -->
  <rect x="290" y="100" width="420" height="420" rx="8" class="cont"/>
  <text x="302" y="118" class="contlbl">One night: three rounds</text>

  <rect x="310" y="130" width="380" height="92" rx="6" class="round"/>
  <circle cx="330" cy="150" r="10" class="num"/><text x="330" y="154" class="numt" text-anchor="middle">1</text>
  <text x="348" y="154" class="tb">Map</text>
  <text x="348" y="171" class="ts">every pair of papers: agree / disagree / share a limitation</text>
  <text x="348" y="185" class="ts">each verdict cites one passage from each paper</text>
  <text x="348" y="199" class="ts">output: the clash list and the shared-limitation list</text>
  <text x="348" y="213" class="ts">28 pairs, 1 call each</text>

  <path d="M500 222V242" class="edge" marker-end="url(#ah)"/>

  <rect x="310" y="242" width="380" height="92" rx="6" class="round"/>
  <circle cx="330" cy="262" r="10" class="num"/><text x="330" y="266" class="numt" text-anchor="middle">2</text>
  <text x="348" y="266" class="tb">Debate</text>
  <text x="348" y="283" class="ts">for each clash: both students defend with quotes, 2 turns</text>
  <text x="348" y="297" class="ts">PI rules: stands / contested / unresolved</text>
  <text x="348" y="311" class="ts">output: what the library disagrees about, and why</text>
  <text x="348" y="325" class="ts">cap 5 clashes</text>

  <path d="M500 334V354" class="edge" marker-end="url(#ah)"/>

  <rect x="310" y="354" width="380" height="100" rx="6" class="round"/>
  <circle cx="330" cy="374" r="10" class="num"/><text x="330" y="378" class="numt" text-anchor="middle">3</text>
  <text x="348" y="378" class="tb">Directions</text>
  <text x="348" y="395" class="ts">from the unresolved clashes and the shared limitations,</text>
  <text x="348" y="409" class="ts">the PI writes 5–10 directions, each with papers, passages, confidence:</text>
  <text x="348" y="423" class="ts" font-style="italic">"the field will move from A to B, because papers 3 and 7 both hit L"</text>
  <text x="348" y="437" class="ts">a direction without quotes behind it is thrown out</text>
  <text x="348" y="451" class="ts">~5 calls</text>

  <rect x="310" y="466" width="380" height="44" rx="6" class="archive"/>
  <use href="#i-db" x="320" y="476" width="24" height="24" fill="#d6b656" stroke="#d6b656"/>
  <text x="352" y="484" class="tb">Archive</text>
  <text x="352" y="499" class="ts">map, verdicts, directions with evidence; next week starts from here</text>

  <!-- Students -> round 1 -->
  <path d="M240 342H275V176H310" class="edge" marker-end="url(#ah)"/>

  <!-- PI -->
  <rect x="740" y="130" width="230" height="92" rx="8" class="pi"/>
  <use href="#i-gavel" x="752" y="156" width="30" height="30" fill="#b85450"/>
  <text x="792" y="154" class="tb">PI</text>
  <text x="792" y="171" class="ts">chairs all three rounds</text>
  <text x="792" y="185" class="ts">checks that every quote exists</text>
  <text x="792" y="199" class="ts">in the source; feedback only</text>
  <text x="792" y="213" class="ts">ranks the directions</text>
  <path d="M740 176H710" class="edge2" marker-end="url(#ah)"/>

  <!-- Minutes -->
  <rect x="740" y="354" width="230" height="100" rx="8" class="you"/>
  <use href="#i-minutes" x="752" y="380" width="30" height="30" fill="#d79b00" stroke="#d79b00"/>
  <text x="792" y="378" class="tb">Minutes, 8 am</text>
  <text x="792" y="395" class="ts">the directions, ranked, with evidence</text>
  <text x="792" y="409" class="ts">the disagreements and their verdicts</text>
  <text x="792" y="423" class="ts">the "unresolved" items for you</text>
  <text x="792" y="437" class="ts">a note on each paper, back in Zotero</text>
  <path d="M690 404H740" class="edge" marker-end="url(#ah)"/>

  <text x="30" y="545" class="ts">About 60 model calls per night. Only summaries cross rounds; transcripts stay inside the round. Figure 2 shows how the directions are checked.</text>
</svg>
