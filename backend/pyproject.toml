[project]
name = "human-pretraining-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "httpx",
    "pymupdf",
    "beautifulsoup4",
    "python-dotenv",
    "scikit-learn",  # For you's ranking
    "tzdata",  # arXiv's listing deadline is in US Eastern time; Windows has no time-zone database
]

[project.optional-dependencies]
claude-code = [
    "claude-agent-sdk>=0.2.168",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest"]
