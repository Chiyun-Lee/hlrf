[project]
name = "human-pretraining-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "httpx",
    "pymupdf",
    "beautifulsoup4",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest"]
